<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hidden Oasis Apps</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #625b52;
      --line: #ddd6cc;
      --paper: #fbfaf7;
      --soft: #eef3f0;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: linear-gradient(135deg, #fbfaf7, #e8f0ed);
    }
    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    header { margin-bottom: 32px; }
    .eyebrow {
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    h1 {
      margin: 8px 0 10px;
      font-size: clamp(38px, 6vw, 72px);
      line-height: .95;
      letter-spacing: 0;
    }
    p { max-width: 680px; color: var(--muted); font-size: 18px; line-height: 1.5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    a {
      display: block;
      min-height: 184px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: rgba(255,250,242,.78);
      box-shadow: 0 18px 45px rgba(28,25,23,.08);
    }
    a:hover { border-color: var(--accent); transform: translateY(-2px); }
    strong { display: block; font-size: 22px; margin-bottom: 10px; }
    span { color: var(--muted); line-height: 1.42; }
    footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      main { padding: 32px 0; }
      .grid { grid-template-columns: 1fr; }
      a { min-height: 140px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Hidden Oasis</div>
      <h1>Hidden Oasis</h1>
      <p>Choose an app.</p>
    </header>
    <section class="grid" aria-label="Hidden Oasis applications">
      <a href="https://accounting.hiddenoasis.app">
        <strong>Accounting</strong>
        <span>Books &middot; PR/PO &middot; Reports</span>
      </a>
      <a href="https://pos.hiddenoasis.app">
        <strong>POS</strong>
        <span>Orders &middot; Drawer &middot; Room Charges</span>
      </a>
      <a href="https://operations.hiddenoasis.app">
        <strong>Operations</strong>
        <span>Tasks &middot; Requests &middot; Reviews</span>
      </a>
      <a href="https://staff.hiddenoasis.app">
        <strong>Staff</strong>
        <span>Attendance &middot; Payroll &middot; Leaves</span>
      </a>
    </section>
    <footer>Hidden Oasis Systems &middot; by C.M.</footer>
  </main>
</body>
</html>
