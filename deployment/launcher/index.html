<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hidden Oasis</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #7b8179;
      --line: #e1e6df;
      --paper: rgba(255,255,255,.9);
      --shadow: 0 18px 52px rgba(26,38,30,.08);
      --green: #1f6a47;
      --blue: #243b68;
      --brown: #7a5531;
      --olive: #5f6f52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #f8fbf9 0, transparent 32%),
        radial-gradient(circle at bottom right, #eef2f8 0, transparent 28%),
        #f6f6f4;
    }

    main {
      min-height: 100vh;
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      align-content: center;
      gap: 24px;
      padding: 42px 0;
    }

    header {
      display: grid;
      gap: 8px;
      justify-items: start;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7.35vw, 80px);
      line-height: .92;
      letter-spacing: -.065em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    a {
      position: relative;
      min-height: 118px;
      display: grid;
      align-content: end;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    a::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: var(--accent);
    }

    a:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 24px 64px rgba(26,38,30,.12);
    }

    .tile-content {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    strong {
      display: block;
      margin: 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -.05em;
    }

    .arrow {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      transform: translateY(2px);
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    a:hover .arrow {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    footer {
      color: var(--muted);
      font-size: 13px;
    }

    .accounting { --accent: var(--green); }
    .pos { --accent: var(--blue); }
    .operations { --accent: var(--brown); }
    .staff { --accent: var(--olive); }

    @media (max-width: 900px) {
      main { align-content: start; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      main { width: min(420px, calc(100% - 32px)); padding: 32px 0; }
      .grid { grid-template-columns: 1fr; }
      a { min-height: 108px; }
      h1 { font-size: 48px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hidden Oasis</h1>
    </header>

    <section class="grid" aria-label="Hidden Oasis applications">
      <a class="accounting" href="https://accounting.hiddenoasis.app">
        <div class="tile-content">
          <strong>Accounting</strong>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
      </a>

      <a class="pos" href="https://pos.hiddenoasis.app">
        <div class="tile-content">
          <strong>POS</strong>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
      </a>

      <a class="operations" href="https://operations.hiddenoasis.app">
        <div class="tile-content">
          <strong>Operations</strong>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
      </a>

      <a class="staff" href="https://staff.hiddenoasis.app">
        <div class="tile-content">
          <strong>Staff</strong>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
      </a>
    </section>

    <footer>Hidden Oasis Systems · by C.M.</footer>
  </main>
</body>
</html>
