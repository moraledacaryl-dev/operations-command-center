# Enable only after accounting.hiddenoasis.app is verified.

server {
    listen 80;
    server_name hiddenoasis.app www.hiddenoasis.app;
    root /var/www/hidden-oasis-launcher;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

