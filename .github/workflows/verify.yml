name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: operations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - name: Run full backend test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v
      - name: Verify clean database migration
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite:////tmp/operations-clean.db
          PYTHONPATH: .
        run: |
          rm -f /tmp/operations-clean.db
          alembic upgrade head
          alembic current
      - name: Verify representative prior-schema upgrade
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite:////tmp/operations-legacy.db
          PYTHONPATH: .
        run: |
          rm -f /tmp/operations-legacy.db
          alembic upgrade 0002_integration_identity
          alembic upgrade head
          alembic current
      - name: Verify SQLite migration round trip
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite:////tmp/operations-roundtrip.db
          PYTHONPATH: .
        run: |
          rm -f /tmp/operations-roundtrip.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: Verify PostgreSQL migration round trip
        env:
          ENVIRONMENT: local
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/operations_ci
          PYTHONPATH: .
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify standalone package contains static assets
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -n "$(find .next/standalone/.next/static -type f | head -1)"

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install pinned browser test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility regressions
        run: npx playwright test --config=playwright.config.ts
      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-screenshots
          path: frontend/test-results/ui-audit/*
          if-no-files-found: error
          retention-days: 7
