name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - name: Run full backend test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v
      - name: Verify clean database migration
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite:////tmp/operations-clean.db
          PYTHONPATH: .
        run: |
          rm -f /tmp/operations-clean.db
          alembic upgrade head
          alembic current
      - name: Verify representative prior-schema upgrade
        env:
          ENVIRONMENT: local
          DATABASE_URL: sqlite:////tmp/operations-legacy.db
          PYTHONPATH: .
        run: |
          rm -f /tmp/operations-legacy.db
          alembic upgrade 0002_integration_identity
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify standalone package contains static assets
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -n "$(find .next/standalone/.next/static -type f | head -1)"

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install pinned Playwright test dependency
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Pass 4 browser regressions
        run: npx playwright test --config=playwright.config.ts
