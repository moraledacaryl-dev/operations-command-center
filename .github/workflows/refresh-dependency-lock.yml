name: Refresh dependency lock

on:
  push:
    branches:
      - agent/pass-12-dependency-security-final

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass-12-dependency-security-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile with patched overrides
        working-directory: frontend
        run: npm install --package-lock-only
      - name: Require no high/critical production vulnerabilities
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Require no high/critical vulnerabilities in full tree
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Commit regenerated lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/refresh-dependency-lock.yml
          git commit -m "Pass 12: regenerate patched dependency lockfile"
          git push origin HEAD:agent/pass-12-dependency-security-final
