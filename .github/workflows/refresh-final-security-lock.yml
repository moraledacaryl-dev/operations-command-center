name: Refresh final security lock

on:
  push:
    branches:
      - agent/final-dependency-security
    paths:
      - frontend/package.json
      - .github/workflows/refresh-final-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-dependency-security
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile from patched overrides
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production audit is clean at high severity
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git commit -m "Security: refresh frontend lockfile"
          git push origin HEAD:agent/final-dependency-security
