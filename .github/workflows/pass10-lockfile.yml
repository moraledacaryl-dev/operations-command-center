name: Pass 10 lockfile refresh

on:
  push:
    branches:
      - agent/pass-10-auth-platform-hardening

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass-10-auth-platform-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify exact patched versions
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/next'].version!=='15.5.24'||l.packages['node_modules/eslint-config-next'].version!=='15.5.24') process.exit(1)"
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Pass 10: lock Next.js security patch'
          git push origin HEAD:agent/pass-10-auth-platform-hardening
