name: Refresh Security Lockfile
on:
  push:
    branches: [security-pass1-production-guards]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/refresh-security-lockfile.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-pass1-production-guards
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Regenerate lockfile with patched dependencies
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh dependency lockfile for patched packages'
            git push origin HEAD:security-pass1-production-guards
          fi
