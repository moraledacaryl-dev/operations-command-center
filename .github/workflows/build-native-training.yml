name: Build Native Operations Training Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deployment/training-native/**'
      - '.github/workflows/build-native-training.yml'
      - 'backend/scripts/seed_training_demo.py'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate installer syntax and safety boundaries
        run: |
          set -euo pipefail
          bash -n deployment/training-native/install-first.sh
          bash -n deployment/training-native/verify-only.sh
          python3 deployment/training-native/check_release.py --self-test
      - name: Build training-only standalone frontend on runner, not on production VPS
        working-directory: frontend
        env:
          NEXT_PUBLIC_TRAINING_MODE: 'true'
          NEXT_PUBLIC_DEMO_PREVIEW: 'true'
          OPERATIONS_API_ORIGIN: http://127.0.0.1:8401
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
      - name: Download pinned Linux Python wheels on runner
        run: |
          mkdir -p /tmp/operations-training-wheelhouse
          python3 -m pip download --only-binary=:all: --dest /tmp/operations-training-wheelhouse -r backend/requirements.txt
      - name: Package a versioned training-only artifact
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          mkdir -p /tmp/operations-training-release/{backend,frontend/standalone,wheelhouse,deployment/training-native}
          cp -a backend/app backend/alembic backend/scripts /tmp/operations-training-release/backend/
          cp backend/alembic.ini backend/requirements.txt /tmp/operations-training-release/backend/
          cp -a frontend/.next/standalone/. /tmp/operations-training-release/frontend/standalone/
          cp -a /tmp/operations-training-wheelhouse/. /tmp/operations-training-release/wheelhouse/
          cp deployment/training-native/install-first.sh deployment/training-native/verify-only.sh deployment/training-native/check_release.py deployment/training-native/operations-training-backend.service deployment/training-native/operations-training-frontend.service /tmp/operations-training-release/deployment/training-native/
          printf '%s\n' "$SHA" > /tmp/operations-training-release/commit.sha
          python3 deployment/training-native/check_release.py --directory /tmp/operations-training-release
          mkdir -p dist
          tar -C /tmp/operations-training-release -czf "dist/operations-training-native-$SHA.tar.gz" .
          (cd dist && sha256sum "operations-training-native-$SHA.tar.gz" > "operations-training-native-$SHA.tar.gz.sha256")
          ls -lh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: operations-training-native-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
